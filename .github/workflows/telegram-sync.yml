name: Telegram → черновики домашек
 
on:
  schedule:
    - cron: '*/10 * * * *'   # каждые ~10 минут (GitHub может задерживать запуск)
  workflow_dispatch:         # ручной запуск: вкладка Actions → Run workflow
 
concurrency:
  group: telegram-sync
  cancel-in-progress: false
 
permissions:
  contents: write
 
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Забрать новые сообщения
        run: python3 scripts/telegram_sync.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROUP_CODE: ${{ vars.GROUP_CODE }}
          TG_ALLOWED_IDS: ${{ vars.TG_ALLOWED_IDS }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
