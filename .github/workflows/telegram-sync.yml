name: Telegram → черновики домашек
 
on:
  schedule:
    - cron: '7 * * * *'      # раз в час, в 7 минут каждого часа (GitHub может задерживать запуск на 5–30 минут)
  workflow_dispatch:         # ручной запуск: вкладка Actions → Run workflow
 
concurrency:
  group: telegram-sync
  cancel-in-progress: false
 
permissions:
  contents: write
 
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Забрать новые сообщения
        run: python3 scripts/telegram_sync.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROUP_CODE: ${{ vars.GROUP_CODE }}
          TG_ALLOWED_IDS: ${{ vars.TG_ALLOWED_IDS }}
          TG_CHAT_ID: ${{ vars.TG_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TG_MAX_AGE_HOURS: ${{ vars.TG_MAX_AGE_HOURS }}
          TG_ONLY_ALLOWED: ${{ vars.TG_ONLY_ALLOWED }}
          TG_AUTO_PUBLISH: ${{ vars.TG_AUTO_PUBLISH }}
          TG_AUTO_MIN_CONFIDENCE: ${{ vars.TG_AUTO_MIN_CONFIDENCE }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
