<script>
/* Домашки МГУ. Данные лежат в data.json этого репозитория (GitHub). Студенты входят по коду группы,
   староста входит один раз с токеном GitHub и может редактировать расписание и задания. */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const jget=(k,d)=>{try{return JSON.parse(ls.get(k))??d}catch(e){return d}};
const CFG=window.APP_CONFIG||{};
const onGh=location.hostname.endsWith('.github.io');
const parts=location.pathname.split('/').filter(Boolean);
const OWNER=CFG.owner||(onGh?location.hostname.split('.')[0]:'');
const REPO=CFG.repo||(onGh?(parts[0]&&!/\.[a-z]+$/i.test(parts[0])?parts[0]:location.hostname):'');
const demo=!(OWNER&&REPO);
let token=ls.get('ghtoken')||'',BR=ls.get('ghbranch')||CFG.branch||'';
let myGroups=jget('groups',[]),act=ls.get('act')||'',done=jget('done',{});
let DB={groups:{}},sha=null,S={name:'',subjects:[],hw:[]},loaded=false,err=null,updated=null,busy=false,ed={},filter='all',past=false;
let T=ls.get('tab')||'sched',viewWeek='',viewDay=0,sgAsked={};
const PAL=['#007aff','#ff9500','#34c759','#af52de','#ff3b30','#30b0c7','#ffcc00','#ff2d55','#5856d6','#a2845e'];
const color=n=>{let h=0;for(const c of n||'')h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600+t.length*45)};
const isHead=()=>demo||!!token;
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
const dl=n=>n<0?`просрочено на ${-n} дн.`:n===0?'сегодня':n===1?'завтра':`через ${n} дн.`;
const rid=()=>Math.random().toString(36).slice(2,9);
const safeUrl=u=>/^https?:\/\//i.test(u)?u:null;
const tm=t=>String(t||'').replace(/^0/,'');
const openDlg=h=>{const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()};
const closeDlg=()=>{const d=$('#dlg');if(d.open)d.close()};
const saveG=()=>{ls.set('groups',JSON.stringify(myGroups));ls.set('act',act)};
const norm=d=>({name:d.name||'Группа',subjects:d.subjects||[],hw:d.hw||[],ts:d.ts||0,schedule:d.schedule,wref:d.wref});
const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const gen=n=>{const a=new Uint32Array(n);(crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*4e9));return [...a].map(x=>A[x%A.length]).join('')};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t.replace(/\s/g,'')),c=>c.charCodeAt(0));
const fileUrl=f=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BR||'main'}/${f.path}`;
const CYR_LOOK={'А':'A','В':'B','С':'C','Е':'E','Н':'H','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X','У':'Y'};
const CYR_KEY={'Й':'Q','Ц':'W','У':'E','К':'R','Е':'T','Н':'Y','Г':'U','Ш':'I','Щ':'O','З':'P','Ф':'A','Ы':'S','В':'D','А':'F','П':'G','Р':'H','О':'J','Л':'K','Д':'L','Я':'Z','Ч':'X','С':'C','М':'V','И':'B','Т':'N','Ь':'M'};
function cands(raw){const u=String(raw||'').toUpperCase().replace(/[^A-ZА-ЯЁ0-9]/g,'');const m=t=>[...u].map(c=>t[c]||c).join('');return [...new Set([u,m(CYR_LOOK),m(CYR_KEY)])].filter(Boolean)}
const IC={cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',list:'<path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20"/><path d="M3.8 6.4l1.2 1.2 2.1-2.4M3.8 11.9l1.2 1.2 2.1-2.4M3.8 17.4l1.2 1.2 2.1-2.4"/>',people:'<circle cx="9" cy="8.2" r="3.2"/><path d="M3 19.5c.6-3.3 3-5.2 6-5.2s5.4 1.9 6 5.2"/><circle cx="17.2" cy="9" r="2.4"/><path d="M16.6 14.4c2.4.2 4 1.8 4.4 4.4"/>',plus:'<path d="M12 5v14M5 12h14"/>',ref:'<path d="M20 11.5a8 8 0 1 0-2.4 5.6"/><path d="M20.3 4.8v6.2h-6.2"/>',chev:'<path d="M6.5 9.5l5.5 5.5 5.5-5.5"/>'};

/* ---------- Расписание по умолчанию: 1 курс, 103 группа, осень 2026 ---------- */
const P={1:['09:00','10:35'],2:['10:50','12:25'],3:['13:10','14:45'],4:['14:55','16:30'],5:['16:40','18:15']};
function def103(){
  const out=[];let n=0;
  const L=(day,p,week,sg,title,o={})=>{const t=Array.isArray(p)?p:P[p];out.push({id:'d'+(++n),day,start:t[0],end:t[1],week,sg,title,kind:o.k||'',room:o.r||'',teacher:o.t||'',note:o.n||'',link:o.l||''})};

  L(1,4,'down',1,'Метеорология',{r:'2004'});L(1,4,'down',2,'Гидрология',{r:'1720'});

  L(2,1,'all',0,'Гидрология',{k:LEC,t:'проф. Фролова',r:'02'});
  L(2,2,'all',0,'Введение в физическую географию с основами землеведения',{k:LEC,t:'проф. Дьяконов',r:'02'});
  L(2,3,'all',0,'Биология',{k:LEC,t:'проф. Бобров',r:'02'});
  L(2,4,'all',0,'Климатология с основами метеорологии',{k:LEC,t:'доц. Константинов',r:'02'});
  L(3,1,'all',0,'Топография',{k:LEC,t:'доц. Прасолова',r:'02',l:U+'26158090430'});
  L(3,2,'all',0,'Социально-экономическая география',{k:LEC,t:'доц. Гладкевич, проф. Савоскул',r:'02',l:U+'26158090430'});
  L(3,3,'all',0,'Геоморфология с основами геологии',{k:LEC,t:'проф. Болысов',r:'02',l:U+'26158090430'});
  L(3,4,'all',0,'МФК');

  L(4,2,'up',0,'Климатология с основами метеорологии',{k:LEC,t:'доц. Константинов',r:'02'});
  L(4,2,'down',0,'Социально-экономическая география',{k:LEC,t:'доц. Гладкевич, проф. Савоскул',r:'02',n:'8 октября',l:U+'26227804396'});
  L(4,3,'all',0,'Математика',{k:LEC,t:'доц. Семенов',r:'02',n:'8 октября',l:U+'26227804396'});
  L(4,4,'all',0,'Математика',{k:SEM,t:'пр. Орлова',r:'2012'});
  L(5,1,'all',0,'Физическая культура',{t:'ст. преп. Комаров',r:'Трёхзальный корпус'});
  L(5,2,'up',0,'Гидрология',{k:LEC,t:'проф. Фролова',r:'02'});
  L(5,2,'down',0,'Геоморфология с основами геологии',{k:LEC,t:'проф. Болысов',r:'02',n:'9 октября',l:U+'26228551394'});
  L(5,3,'all',0,'Русский язык и культура речи',{k:LEC,t:'доц. Рождественская',r:'02',n:'9 октября',l:U+'26228551394'});
  L(6,1,'all',1,'Геоморфология',{k:SEM,r:'1708'});L(6,1,'all',2,'Геоморфология',{k:SEM,r:'1717'});
  L(6,2,'up',0,'Социально-экономическая география',{k:SEM,r:'2012'});

  L(6,['12:40','15:00'],'all',0,'История России',{k:LEC,t:'доц. Ткаченко',r:'1807',n:'3 часа · 10 октября',l:U+'26334874346'});
  return out;
}
const defFor=name=>/103/.test(name||'')?def103():[];
const sched=()=>S.schedule??defFor(S.name);

/* ---------- Недели и подгруппы ---------- */
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function weekType(d){const ref=new Date((S.wref||'2026-08-31')+'T00:00:00');const w=Math.round((mondayOf(d)-mondayOf(ref))/6048e5);return ((w%2)+2)%2===0?'up':'down'}
function initView(){const now=new Date(),dow=now.getDay();if(dow===0){const n=new Date(now);n.setDate(n.getDate()+1);viewWeek=weekType(n);viewDay=1}else{viewWeek=weekType(now);viewDay=dow}}
const sgPref=()=>ls.get('sg_'+act)||'';
const sgText=p=>p==='1'?'1 подгруппа':p==='2'?'2 подгруппа':p==='all'?'Все подгруппы':'не выбрана';
const hwVisible=x=>{const p=sgPref();return !p||p==='all'||!x.sg||String(x.sg)===p};

/* ---------- GitHub как хранилище (без изменений) ---------- */
const gh=(path,opt={})=>fetch('https://api.github.com'+path,{cache:'no-store',...opt,headers:{Accept:'application/vnd.github+json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});
const errText=async r=>{let m='HTTP '+r.status;try{m=(await r.json()).message||m}catch(e){}
  if(/not accessible by personal access token/i.test(m)||r.status===403)return 'у токена нет права записи. Создайте токен по ссылке из окна «Я староста» (галочка public_repo).';
  return m};
function logout(){token='';ls.del('ghtoken');render()}
async function loadDB(){
  if(demo){DB=jget('demodb',{groups:{}});DB.groups=DB.groups||{};return}
  if(token){
    const r=await gh(`/repos/${OWNER}/${REPO}/contents/data.json?t=${Date.now()}`+(BR?`&ref=${BR}`:''));
    if(r.status===404){sha=null;DB={groups:{}};return}
    if(r.status===401){logout();throw new Error('токен недействителен — войдите как староста заново')}
    if(!r.ok)throw new Error(await errText(r));
    const j=await r.json();sha=j.sha;DB=JSON.parse(new TextDecoder().decode(unb64(j.content)));DB.groups=DB.groups||{};return;
  }
  for(const b of [...new Set([BR,CFG.branch,'main','master'].filter(Boolean))]){
    const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${b}/data.json?t=${Date.now()}`,{cache:'no-store'});
    if(r.ok){DB=await r.json();DB.groups=DB.groups||{};if(!BR)BR=b;return}
  }
  DB={groups:{}};
}
async function putDB(msg){
  if(demo){ls.set('demodb',JSON.stringify(DB));return true}
  const body={message:msg||'Обновление',content:b64(new TextEncoder().encode(JSON.stringify(DB,null,1)))};
  if(sha)body.sha=sha;if(BR)body.branch=BR;
  const r=await gh(`/repos/${OWNER}/${REPO}/contents/data.json`,{method:'PUT',body:JSON.stringify(body)});
  if(r.ok){sha=(await r.json()).content.sha;return true}
  if(r.status===409||r.status===422)return false;
  throw new Error(await errText(r));
}
async function edit(fn,msg){for(let i=0;i<3;i++){await loadDB();fn(DB);if(await putDB(msg))return}throw new Error('конфликт при сохранении, попробуйте ещё раз')}

    if(act&&g){const wasRef=S.wref;S=norm(g);err=null;const m=myGroups.find(x=>x.code===act);if(m&&m.name!==S.name){m.name=S.name;saveG()}
      if(lastAct!==act||wasRef!==S.wref){viewWeek='';lastAct=act}}
    else if(act)err='Группа не найдена: код неверный или группу удалили.';
    updated=Date.now();
  }catch(e){err='Нет связи с GitHub: '+(e.message||e)}
  loaded=true;render();
  if(act&&DB.groups[act]&&!sgPref()&&!sgAsked[act]&&!$('#dlg').open){sgAsked[act]=1;pickSg()}
}
async function mutate(fn){

  S=norm(DB.groups[act]);err=null;updated=Date.now();render();
}
const run=async(p,ok)=>{if(busy)return false;busy=true;try{await p;if(ok)toast(ok);busy=false;return true}catch(e){toast('Ошибка: '+(e.message||e));busy=false;return false}};
async function uploadFile(f){
  if(demo)throw new Error('в демо-режиме файлы не грузятся — используйте ссылки');
  if(f.size>15*1024*1024)throw new Error('файл больше 15 МБ');
  const path=`files/${act}-${Date.now()}-`+f.name.replace(/[^\w.\-]+/g,'_');
  const body={message:'Файл: '+f.name,content:b64(new Uint8Array(await f.arrayBuffer()))};if(BR)body.branch=BR;
  const r=await gh(`/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await errText(r));
  return {name:f.name,path};
}

function schedView(){
  const head=isHead(),pref=sgPref(),now=new Date(),ct=weekType(now);
  if(!viewWeek)initView();
  const base=mondayOf(now);if(viewWeek!==ct)base.setDate(base.getDate()+7);
  const dayBtns=DAYS.map((n,i)=>{const d=new Date(base);d.setDate(d.getDate()+i);const t=d.toDateString()===now.toDateString();
    return `<button class="day ${viewDay===i+1?'on':''} ${t?'today':''}" data-act="day" data-v="${i+1}"><small>${n}</small><span class="n">${d.getDate()}</span></button>`}).join('');
  const sel=new Date(base);sel.setDate(sel.getDate()+viewDay-1);const isToday=sel.toDateString()===now.toDateString();
  const vis=l=>l.day===viewDay&&(l.week==='all'||l.week===viewWeek)&&(!pref||pref==='all'||!l.sg||String(l.sg)===pref);
  const list=sched().filter(vis).sort((a,b)=>a.start.localeCompare(b.start)||(a.sg||0)-(b.sg||0));
  const mins=t=>{const [h,m]=t.split(':');return +h*60+ +m},nm=now.getHours()*60+now.getMinutes();
  let nextId='';if(isToday){const n=list.find(l=>mins(l.start)>nm);nextId=n?.id}
  let h=`<div class="large">Расписание</div><p class="sub">${esc(S.name)} · ${esc(sgText(pref))} · сейчас ${ct==='up'?'верхняя':'нижняя'} неделя</p>
  <div class="seg"><button class="${viewWeek==='up'?'on':''}" data-act="week" data-v="up">Верхняя неделя</button><button class="${viewWeek==='down'?'on':''}" data-act="week" data-v="down">Нижняя неделя</button></div>
  <div class="days">${dayBtns}</div><div class="sec" style="margin-top:4px">${DAYF[viewDay-1]}, ${sel.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div>`;
  if(!list.length)return h+`<div class="list"><div class="empty"><b>🌤</b>Пар нет</div></div>`;
  h+='<div class="list">'+list.map(l=>{
    const cur=isToday&&mins(l.start)<=nm&&nm<mins(l.end),c=color(l.title);
    const meta=[l.kind,l.room?(/^\d+$/.test(l.room)?'ауд. '+l.room:l.room):'',l.teacher].filter(Boolean).map(esc).join(' · ');
    const pills=[l.sg?`<span class="pill t">${l.sg} п/г</span>`:'',cur?'<span class="pill t">Идёт сейчас</span>':(l.id===nextId?'<span class="pill">Дальше</span>':''),l.note?`<span class="pill">${esc(l.note)}</span>`:'',safeUrl(l.link)?`<a class="pill t" href="${esc(l.link)}" target="_blank" rel="noopener">Онлайн</a>`:''].join('');
    return `<${head?'button':'div'} class="les ${cur?'now':''}" ${head?`data-act="editLes" data-id="${esc(l.id)}"`:''}><div class="tm"><b>${tm(l.start)}</b><span>${tm(l.end)}</span></div><i class="bar" style="background:${c}"></i><div class="lb"><div class="lt">${esc(l.title)}</div>${meta?`<div class="lm">${meta}</div>`:''}${pills?`<div class="pills">${pills}</div>`:''}</div></${head?'button':'div'}>`}).join('')+'</div>';
  if(head)h+='<div class="hint" style="margin:10px 16px 0">Нажмите на пару, чтобы изменить. «+» вверху добавляет пару.</div>';
  return h;
}
function hwView(){

  const list=all.filter(x=>filter==='all'||x.sid===filter).sort((a,b)=>a.due.localeCompare(b.due)||a.title.localeCompare(b.title));
  const over=list.filter(x=>!up(x)),overOpen=over.filter(x=>!done[x.id]);let any=false;
  const sect=(t,l,bad)=>{if(!l.length)return;any=true;h+=`<div class="sec" ${bad?'style="color:var(--red)"':''}>${t}</div><div class="list">${l.map(row).join('')}</div>`};
  sect('Просрочено',overOpen,true);

  if(!any)h+=`<div class="list"><div class="empty"><b>🎉</b>${S.subjects.length?'Заданий нет':(head?'Начните с кнопки «+ предмет»':'Староста пока не добавил предметы')}</div></div>`;

  drawFiles();

const drawFiles=()=>{const e=$('#f_files');if(e)e.innerHTML=ed.files.length?ed.files.map((f,i)=>`<a href="${esc(fileUrl(f))}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a><button class="pill" style="color:var(--red)" data-act="rmFile" data-i="${i}">убрать</button>`).join(''):'<span style="font-size:14px;color:var(--mut)">нет вложений</span>'};
function loginDlg(){

}
function groupsDlg(){
  const head=isHead(),all=head?Object.entries(DB.groups).map(([code,g])=>({code,name:g.name})):myGroups;

}
