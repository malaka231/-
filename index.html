<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домашки МГУ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
:root{--bg:#f4f5f9;--card:#fff;--ink:#1b1f2a;--mut:#6b7280;--pri:#1f3f8f;--onpri:#fff;--acc:#c9a227;--bad:#c0392b;--ok:#2e8b57;--line:#e3e6ee;--chip:#e9edf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141b;--card:#1c202b;--ink:#eceef4;--mut:#9aa1b2;--pri:#7d9cf0;--onpri:#10152a;--line:#2b3040;--chip:#262c3d}}
:root[data-theme="dark"]{--bg:#12141b;--card:#1c202b;--ink:#eceef4;--mut:#9aa1b2;--pri:#7d9cf0;--onpri:#10152a;--line:#2b3040;--chip:#262c3d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:12px 14px 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--chip);color:var(--ink)}
button.p{background:var(--pri);color:var(--onpri);font-weight:600}
button.d{color:var(--bad)}button.s{padding:5px 9px;font-size:13px}
input[type=text],input[type=date],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:10px 0 0;font-size:13px;color:var(--mut)}label.f>*{margin-top:4px;color:var(--ink)}
header{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
.gb{font-weight:700;font-size:18px;background:none;padding:6px 0;text-align:left}
.badge{font-size:11px;background:var(--acc);color:#222;border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border-radius:20px;padding:7px 13px;background:var(--chip)}
.chip.on{background:var(--pri);color:var(--onpri)}.chip small{opacity:.7;margin-left:4px}
h3.g{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 0 8px}
h3.g.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px}
.card.dn{opacity:.55}.card.dn h4{text-decoration:line-through}
.card .bd{flex:1;min-width:0}.card h4{margin:4px 0;font-size:16px}
.card input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.tag{font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:2px 8px}
.due{font-size:13px;color:var(--mut);margin-left:6px}.due.bad{color:var(--bad)}
.desc{white-space:pre-wrap;color:var(--mut);font-size:14px;margin:4px 0}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.att a{font-size:13px;background:var(--chip);color:var(--pri);padding:4px 9px;border-radius:8px;text-decoration:none;word-break:break-all}
.acts{display:flex;gap:6px;margin-top:8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;border-radius:30px;padding:14px 20px}
.empty,.hint{text-align:center;color:var(--mut);padding:26px 10px}.hint{padding:8px;font-size:13px}
dialog{border:0;border-radius:16px;padding:18px;width:min(520px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0007}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row>*{flex:1}
.mem{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.mem span{flex:1}
.code{font:700 22px ui-monospace,monospace;letter-spacing:.15em;background:var(--chip);border-radius:10px;padding:8px 12px;text-align:center}
.wel{text-align:center;padding:40px 6px}.wel h1{font-size:28px;margin:0 0 6px}.wel p{color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
.sub{font-size:12px;color:var(--mut)}.hb{display:flex;gap:6px}.gb{cursor:default}
.tok{font:13px ui-monospace,monospace}ol{padding-left:20px;margin:8px 0;font-size:14px}ol li{margin:4px 0}a.l{color:var(--pri)}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="empty">Загрузка…</div></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
/* Домашки МГУ — работает на GitHub Pages без сторонних сервисов.
   Данные лежат в data.json в этом же репозитории.
   Читать может любой, у кого есть ссылка. Писать — староста с токеном GitHub. */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const CFG=window.APP_CONFIG||{};
const onGh=location.hostname.endsWith('.github.io');
const parts=location.pathname.split('/').filter(Boolean);
const OWNER=CFG.owner||(onGh?location.hostname.split('.')[0]:'');
const REPO=CFG.repo||(onGh?(parts[0]&&!/\.[a-z]+$/i.test(parts[0])?parts[0]:location.hostname):'');
const demo=!(OWNER&&REPO);
let token=ls.get('ghtoken')||'',BR=ls.get('ghbranch')||CFG.branch||'';
let S={name:'Моя группа',branch:'',subjects:[],hw:[]},sha=null,loaded=false,err=null,updated=null;
let done={};try{done=JSON.parse(ls.get('done')||'{}')}catch(e){}
let filter='all',past=false,ed=null,busy=false;
const PAL=['#1f5fbf','#b8542a','#2e8b57','#8e44ad','#c0392b','#0e8a8a','#a07a00','#d0457f'];
const color=n=>{let h=0;for(const c of n||'')h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600+t.length*45)};
const isHead=()=>demo||!!token;
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
const dl=n=>n<0?`просрочено на ${-n} дн.`:n===0?'сегодня':n===1?'завтра':`через ${n} дн.`;
const rid=()=>Math.random().toString(36).slice(2,9);
const safeUrl=u=>/^https?:\/\//i.test(u)?u:null;
const openDlg=h=>{const d=$('#dlg');d.innerHTML=h;if(!d.open)d.showModal()};
const closeDlg=()=>{const d=$('#dlg');if(d.open)d.close()};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t.replace(/\s/g,'')),c=>c.charCodeAt(0));
const norm=d=>({name:d.name||'Моя группа',branch:d.branch||'',subjects:d.subjects||[],hw:d.hw||[],ts:d.ts});
const fileUrl=f=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${S.branch||BR||'main'}/${f.path}`;

function ask({title,label,value='',ok='Готово',input=true,text='',cancel=true}){
  return new Promise(res=>{
    openDlg(`<h3 style="margin:0 0 6px">${esc(title)}</h3>${text?`<p style="color:var(--mut);font-size:14px">${esc(text)}</p>`:''}
    ${input?`<label class="f">${esc(label||'')}<input type="text" id="ask_v" value="${esc(value)}"></label>`:''}
    <div class="row">${cancel?'<button id="ask_c">Отмена</button>':''}<button class="p" id="ask_o">${esc(ok)}</button></div>`);
    const v=$('#ask_v');v?.focus();
    const c=$('#ask_c');if(c)c.onclick=()=>{closeDlg();res(null)};
    $('#ask_o').onclick=()=>{const x=v?v.value.trim():true;closeDlg();res(x||null)};
  });
}

/* ---------- GitHub ---------- */
const gh=(path,opt={})=>fetch('https://api.github.com'+path,{cache:'no-store',...opt,headers:{Accept:'application/vnd.github+json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});
const errText=async r=>{try{return (await r.json()).message||('HTTP '+r.status)}catch(e){return 'HTTP '+r.status}};
async function loadPublic(){
  const bs=[...new Set([S.branch,CFG.branch,'main','master'].filter(Boolean))];
  for(const b of bs){
    const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${b}/data.json?t=${Date.now()}`,{cache:'no-store'});
    if(r.ok)return await r.json();
  }
  return null;
}
async function load(){
  try{
    if(demo){const d=JSON.parse(ls.get('demo')||'null');if(d)S=norm(d)}
    else if(token){
      const r=await gh(`/repos/${OWNER}/${REPO}/contents/data.json?t=${Date.now()}`+(BR?`&ref=${BR}`:''));
      if(r.status===404)sha=null;
      else if(r.status===401){logout();toast('Токен недействителен — войдите заново');return load()}
      else if(!r.ok)throw new Error(await errText(r));
      else{const j=await r.json();sha=j.sha;S=norm(JSON.parse(new TextDecoder().decode(unb64(j.content))))}
    }else{const d=await loadPublic();if(d)S=norm(d)}
    err=null;updated=Date.now();
  }catch(e){err='Нет связи с GitHub: '+(e.message||e)}
  loaded=true;render();
}
async function mutate(fn,msg){
  if(demo){const n=norm(JSON.parse(JSON.stringify(S)));fn(n);S=n;ls.set('demo',JSON.stringify(S));render();return}
  for(let i=0;i<3;i++){
    await load();if(err)throw new Error(err);
    const n=norm(JSON.parse(JSON.stringify(S)));fn(n);n.ts=Date.now();if(BR)n.branch=BR;
    const body={message:msg||'Обновление',content:b64(new TextEncoder().encode(JSON.stringify(n,null,1)))};
    if(sha)body.sha=sha;if(BR)body.branch=BR;
    const r=await gh(`/repos/${OWNER}/${REPO}/contents/data.json`,{method:'PUT',body:JSON.stringify(body)});
    if(r.ok){const j=await r.json();sha=j.content.sha;S=n;render();return}
    if(r.status===409||r.status===422)continue;
    throw new Error(await errText(r));
  }
  throw new Error('Конфликт при сохранении, попробуйте ещё раз');
}
const run=async(p,ok)=>{if(busy)return;busy=true;try{await p;if(ok)toast(ok)}catch(e){toast('Ошибка: '+(e.message||e))}busy=false};
function logout(){token='';ls.del('ghtoken');render()}
async function uploadFile(f){
  if(demo)throw new Error('в демо-режиме файлы не загружаются — используйте ссылки');
  if(f.size>15*1024*1024)throw new Error('файл больше 15 МБ');
  const path='files/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
  const body={message:'Файл: '+f.name,content:b64(new Uint8Array(await f.arrayBuffer()))};if(BR)body.branch=BR;
  const r=await gh(`/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',body:JSON.stringify(body)});
  if(!r.ok)throw new Error(await errText(r));
  return {name:f.name,path};
}

/* ---------- Рендер ---------- */
function render(){
  const app=$('#app');if(!loaded)return;
  const head=isHead();
  const upd=updated?new Date(updated).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
  let h=`<header><div><div class="gb">${esc(S.name)}${head?'<span class="badge">староста</span>':''}</div>
  <div class="sub">${demo?'Демо-режим: данные только на этом устройстве':'Обновлено в '+upd}</div></div>
  <div class="hb"><button data-act="refresh" title="Обновить">⟳</button>${head?'<button data-act="settings">⚙</button>':'<button data-act="login">Я староста</button>'}</div></header>`;
  if(err)h+=`<div class="hint" style="color:var(--bad)">${esc(err)}</div>`;
  const up=x=>days(x.due)>=0;
  h+=`<div class="chips"><button class="chip ${filter==='all'?'on':''}" data-act="filter" data-id="all">Все<small>${S.hw.filter(x=>up(x)&&!done[x.id]).length}</small></button>
  ${S.subjects.map(s=>`<button class="chip ${filter===s.id?'on':''}" data-act="filter" data-id="${s.id}">${esc(s.name)}<small>${S.hw.filter(x=>x.sid===s.id&&up(x)&&!done[x.id]).length}</small></button>`).join('')}
  ${head?'<button class="chip" data-act="addSubj">+ предмет</button>':''}</div>`;
  const list=S.hw.filter(x=>filter==='all'||x.sid===filter).sort((a,b)=>a.due.localeCompare(b.due)||a.title.localeCompare(b.title));
  const over=list.filter(x=>!up(x)),overOpen=over.filter(x=>!done[x.id]);
  let any=overOpen.length>0;
  if(any)h+='<h3 class="g bad">Просрочено</h3>'+overOpen.map(card).join('');
  for(const [t,f] of [['Сегодня',d=>d===0],['Завтра',d=>d===1],['На этой неделе',d=>d>=2&&d<=7],['Позже',d=>d>7]]){
    const l=list.filter(x=>up(x)&&f(days(x.due)));if(l.length){any=true;h+=`<h3 class="g">${t}</h3>`+l.map(card).join('')}}
  if(!any)h+=`<div class="empty">${S.subjects.length?'Заданий нет 🎉':(head?'Начните с кнопки «+ предмет»':'Староста пока не добавил предметы')}</div>`;
  const rest=over.filter(x=>done[x.id]);
  if(rest.length){h+=`<div class="hint"><button class="s" data-act="past">${past?'Скрыть':'Показать'} прошлые выполненные (${rest.length})</button></div>`;if(past)h+=rest.map(card).join('')}
  h+=head?'<button class="p fab" data-act="newHw">+ Задание</button>':'<div class="hint">Отметка «сделано» хранится только на вашем устройстве.</div>';
  app.innerHTML=h;
}
function card(x){
  const s=S.subjects.find(y=>y.id===x.sid),d=days(x.due),dn=!!done[x.id];
  const links=(x.links||[]).map(u=>safeUrl(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">🔗 ${esc(u.replace(/^https?:\/\//,'').slice(0,40))}</a>`:'').join('');
  const files=(x.files||[]).map(f=>`<a href="${esc(fileUrl(f))}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a>`).join('');
  return `<article class="card ${dn?'dn':''}"><input type="checkbox" data-act="toggle" data-id="${x.id}" ${dn?'checked':''}>
  <div class="bd"><span class="tag" style="--c:${color(s?.name)}">${esc(s?.name||'Без предмета')}</span><span class="due ${d<0&&!dn?'bad':''}">до ${fmt(x.due)} · ${dl(d)}</span>
  <h4>${esc(x.title)}</h4>${x.desc?`<div class="desc">${esc(x.desc)}</div>`:''}${links||files?`<div class="att">${files}${links}</div>`:''}
  ${isHead()?`<div class="acts"><button class="s" data-act="editHw" data-id="${x.id}">✎ Изменить</button><button class="s d" data-act="delHw" data-id="${x.id}">Удалить</button></div>`:''}</div></article>`;
}
function hwForm(){
  const o=ed;
  openDlg(`<h3 style="margin:0">${o.id?'Редактировать задание':'Новое задание'}</h3>
  <label class="f">Предмет<select id="f_s">${S.subjects.map(s=>`<option value="${s.id}" ${s.id===o.sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
  <label class="f">Что задали<input type="text" id="f_t" value="${esc(o.title)}" placeholder="Например: задачи 1–10 из листка №3"></label>
  <label class="f">Сдать до<input type="date" id="f_d" value="${esc(o.due)}"></label>
  <label class="f">Подробности<textarea id="f_x">${esc(o.desc)}</textarea></label>
  <label class="f">Ссылки (по одной в строке)<textarea id="f_l" placeholder="https://...">${esc((o.links||[]).join('\n'))}</textarea></label>
  <div class="f" style="margin-top:10px;font-size:13px;color:var(--mut)">Файлы (до 15 МБ)</div><div class="att" id="f_files"></div>
  <input type="file" id="f_up" multiple style="margin-top:6px">
  <div class="row"><button id="f_c">Отмена</button><button class="p" data-act="saveHw" id="f_ok">Сохранить</button></div>`);
  drawFiles();$('#f_c').onclick=closeDlg;
  $('#f_up').onchange=async e=>{
    const b=$('#f_ok');b.disabled=true;b.textContent='Загрузка файла…';
    for(const f of e.target.files){try{ed.files.push(await uploadFile(f))}catch(x){toast('Не загрузился '+f.name+': '+(x.message||x))}}
    e.target.value='';b.disabled=false;b.textContent='Сохранить';drawFiles();
  };
}
const drawFiles=()=>{const e=$('#f_files');if(e)e.innerHTML=ed.files.length?ed.files.map((f,i)=>`<a href="${esc(fileUrl(f))}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a><button class="s d" data-act="rmFile" data-i="${i}">✕</button>`).join(''):'<span style="font-size:13px;color:var(--mut)">нет вложений</span>'};
function settings(){
  openDlg(`<h3 style="margin:0 0 6px">Настройки</h3>
  <div class="mem"><span>Группа: <b>${esc(S.name)}</b></span><button class="s" data-act="renGroup">✎</button></div>
  <h3 class="g">Предметы</h3>
  ${S.subjects.map(s=>`<div class="mem"><span>${esc(s.name)}</span><button class="s" data-act="renSubj" data-id="${s.id}">✎</button><button class="s d" data-act="delSubj" data-id="${s.id}">✕</button></div>`).join('')||'<div class="hint">Пока нет</div>'}
  <div class="row"><button data-act="addSubj">+ Добавить предмет</button></div>
  <h3 class="g">Студенты</h3>
  <p style="font-size:14px;color:var(--mut);margin:0">Студенты просто открывают ссылку на сайт, входить никуда не нужно.</p>
  <div class="row"><button data-act="copyLink">🔗 Скопировать ссылку для студентов</button></div>
  <div class="row"><button class="d" data-act="logout">Выйти из режима старосты</button><button class="p" id="g_c">Закрыть</button></div>`);
  $('#g_c').onclick=closeDlg;
}
function loginDlg(){
  if(demo)return toast('Это демо-режим: вы уже староста');
  openDlg(`<h3 style="margin:0 0 6px">Вход для старосты</h3>
  <p style="font-size:14px;color:var(--mut);margin:0">Нужен токен GitHub с правом записи в репозиторий <b>${esc(OWNER+'/'+REPO)}</b>:</p>
  <ol><li>Откройте <a class="l" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">создание токена</a>.</li>
  <li>Repository access → <i>Only select repositories</i> → этот репозиторий.</li>
  <li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li>
  <li>Generate token, скопируйте и вставьте сюда.</li></ol>
  <label class="f">Токен<input type="text" class="tok" id="tk" autocomplete="off" placeholder="github_pat_..."></label>
  <div class="row"><button id="tk_c">Отмена</button><button class="p" data-act="doLogin">Войти</button></div>`);
  $('#tk_c').onclick=closeDlg;
}

/* ---------- Действия ---------- */
const acts={
  refresh:async()=>{await load();toast(err?'Не удалось обновить':'Обновлено')},
  filter:b=>{filter=b.dataset.id;render()},
  past:()=>{past=!past;render()},
  toggle:b=>{b.checked?done[b.dataset.id]=true:delete done[b.dataset.id];ls.set('done',JSON.stringify(done));render()},
  login:loginDlg,settings,
  doLogin:async()=>{
    const t=$('#tk').value.trim();if(!t)return;
    try{
      const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`,{cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t}});
      if(r.status===401)return toast('Токен не подошёл (неверный или истёк)');
      if(r.status===404)return toast('У токена нет доступа к этому репозиторию — выберите его при создании токена');
      if(!r.ok)return toast('Ошибка GitHub: '+await errText(r));
      const j=await r.json();
      if(!j.permissions?.push)return toast('У токена нет права записи: нужно Contents → Read and write');
      token=t;BR=j.default_branch||BR;ls.set('ghtoken',t);ls.set('ghbranch',BR);
      closeDlg();await load();toast('Вы вошли как староста');
    }catch(e){toast('Нет связи с GitHub: '+e.message)}},
  logout:()=>{logout();closeDlg();toast('Вы вышли')},
  copyLink:async()=>{const u=location.origin+location.pathname;try{await navigator.clipboard.writeText(u);toast('Ссылка скопирована')}catch(e){await ask({title:'Ссылка для студентов',label:'Скопируйте и отправьте',value:u,ok:'Закрыть',cancel:false})}},
  renGroup:async()=>{const n=await ask({title:'Название группы',label:'Например: 1 курс, 103 группа',value:S.name});if(n){await run(mutate(x=>{x.name=n},'Название группы'));settings()}},
  addSubj:async()=>{const n=await ask({title:'Новый предмет',label:'Название (например, Математический анализ)',ok:'Добавить'});
    if(n){await run(mutate(x=>{x.subjects.push({id:rid(),name:n})},'Новый предмет'));if(isHead())render()}},
  renSubj:async b=>{const s=S.subjects.find(y=>y.id===b.dataset.id);const n=await ask({title:'Переименовать',label:'Название',value:s.name});
    if(n){await run(mutate(x=>{x.subjects.find(y=>y.id===s.id).name=n}));settings()}},
  delSubj:async b=>{const s=S.subjects.find(y=>y.id===b.dataset.id),c=S.hw.filter(y=>y.sid===s.id).length;
    if(await ask({title:`Удалить «${s.name}»?`,text:c?`Вместе с предметом удалятся задания: ${c}.`:'',input:false,ok:'Удалить'})){
      await run(mutate(x=>{x.subjects=x.subjects.filter(y=>y.id!==s.id);x.hw=x.hw.filter(y=>y.sid!==s.id)}));settings()}},
  newHw:()=>{if(!S.subjects.length)return toast('Сначала добавьте предмет');
    ed={sid:filter!=='all'?filter:S.subjects[0].id,title:'',desc:'',links:[],files:[],due:new Date(Date.now()+864e5).toLocaleDateString('sv')};hwForm()},
  editHw:b=>{const x=S.hw.find(y=>y.id===b.dataset.id);ed={...x,links:[...(x.links||[])],files:[...(x.files||[])]};hwForm()},
  rmFile:b=>{ed.files.splice(+b.dataset.i,1);drawFiles()},
  saveHw:async()=>{
    const title=$('#f_t').value.trim(),due=$('#f_d').value;if(!title||!due)return toast('Укажите название и срок');
    const rec={id:ed.id||rid(),sid:$('#f_s').value,title,due,desc:$('#f_x').value.trim(),links:$('#f_l').value.split('\n').map(x=>x.trim()).filter(Boolean),files:ed.files};
    const b=$('#f_ok');b.disabled=true;b.textContent='Сохраняю…';
    await run(mutate(x=>{const i=x.hw.findIndex(y=>y.id===rec.id);i>=0?x.hw[i]=rec:x.hw.push(rec)},'Задание: '+title),'Сохранено');
    if(!err||demo)closeDlg();else{b.disabled=false;b.textContent='Сохранить'}},
  delHw:async b=>{const x=S.hw.find(y=>y.id===b.dataset.id);
    if(await ask({title:'Удалить задание?',text:x.title,input:false,ok:'Удалить'}))await run(mutate(n=>{n.hw=n.hw.filter(y=>y.id!==x.id)},'Удалено'),'Удалено')},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#dlg').open)load()});
setInterval(()=>{if(!document.hidden&&!$('#dlg').open&&!busy)load()},120000);
load();
</script>
</body>
</html>
